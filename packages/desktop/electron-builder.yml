electronVersion: 41.2.0
npmRebuild: false
# Native addons and their relative loaders must stay on the real filesystem.
asar: false
appId: sh.omp.desktop
productName: OMP Desktop
executableName: OMP Desktop
protocols:
  - name: OMP Desktop agent link
    schemes:
      - omp-desktop
afterPack: ./scripts/after-pack.js
afterSign: ./scripts/after-sign.js
publish:
  provider: github
  owner: iris-cat-dev
  repo: omp-desktop
directories:
  output: release
files:
  - dist/**/*
  - assets/pets/**/*
  - "!**/*.map"
  - "!**/*.d.{ts,cts,mts}"
  - "!**/node_modules/zod/src/**"
  - "!**/node_modules/openai/src/**"
  - "!**/node_modules/@modelcontextprotocol/sdk/dist/{esm,cjs}/examples/**"
  - "!node_modules/@omp-desktop/*/src/**"
  - "!node_modules/@omp-desktop/**/*.test.*"
  - "!node_modules/@omp-desktop/**/*.spec.*"
  - "!node_modules/@omp-desktop/server/dist/server/web-ui/**"
  - "!node_modules/@vscode/ripgrep*/**"
  # Workspace packages are symlinked, so anything a developer generates inside them
  # can land in the application bundle. CI never has these; a local .debug run adds gigabytes.
  - "!node_modules/@omp-desktop/*/.debug/**"
  - "!node_modules/@omp-desktop/*/.tasks/**"
  - "!node_modules/@omp-desktop/*/conversations/**"
  - "!node_modules/@omp-desktop/*/test-results/**"
  # electron-builder's workspace dependency walk omits this directory even
  # though the bundled CLI imports it at startup. Include the compiled source
  # explicitly so the packaged CLI remains self-contained.
  - from: ../cli/dist/output
    to: node_modules/@omp-desktop/cli/dist/output
    filter:
      - "**/*.js"
extraResources:
  - from: ../app/dist
    to: app-dist
  - from: remote-backend-dist
    to: remote-backend
  - from: ../../skills/hatch-pet
    to: pet-creation/hatch-pet
mac:
  artifactName: "OMP-Desktop-${version}-${arch}.${ext}"
  category: public.app-category.developer-tools
  icon: assets/icon-macos.png
  hardenedRuntime: true
  notarize: true
  extraResources:
    - from: ../../bin/omp-darwin-${arch}
      to: bin/omp
    - from: bin/omp-desktop
      to: bin/omp-desktop
    - from: assets/icon-macos.png
      to: icon.png
    - from: assets/trayTemplate.png
      to: trayTemplate.png
    - from: assets/trayTemplate@2x.png
      to: trayTemplate@2x.png
  target:
    - dmg
    - zip
linux:
  category: Development
  icon: assets
  artifactName: "OMP-Desktop-${version}-${arch}.${ext}"
  maintainer: "OMP Desktop contributors"
  vendor: "OMP Desktop"
  extraResources:
    - from: ../../bin/omp-linux-${arch}
      to: bin/omp
    - from: bin/omp-desktop
      to: bin/omp-desktop
    - from: assets/icon.png
      to: icon.png
  target:
    - AppImage
    - deb
    - rpm
    - tar.gz
appImage:
  artifactName: "OMP-Desktop-${arch}.${ext}"
win:
  artifactName: "OMP-Desktop-Setup-${version}-${arch}.${ext}"
  icon: assets/icon.ico
  signAndEditExecutable: true
  extraResources:
    - from: ../../bin/omp-windows-${arch}.exe
      to: bin/omp.exe
    - from: assets/icon.png
      to: icon.png
    - from: assets/icon.ico
      to: icon.ico
    - from: bin/omp-desktop.cmd
      to: bin/omp-desktop.cmd
  target:
    - nsis
    - zip
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
