name: Package release

on:
  push:
    tags:
      - "[0-9]*"
  workflow_dispatch:
    inputs:
      macos:
        description: Build unsigned macOS arm64 packages (no Apple credentials required)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: package-release-${{ github.ref }}
  cancel-in-progress: false

env:
  # Stock electron skips on any nonempty string; mini-electron treats "0" as false.
  # Skip the unused stock runtime while allowing mini-electron to install on clean CI.
  ELECTRON_SKIP_BINARY_DOWNLOAD: "0"
  LEFTHOOK: "0"
  EXPO_NO_TELEMETRY: "1"

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.targets.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate version and select targets
        id: targets
        uses: actions/github-script@v7
        env:
          BUILD_MACOS: ${{ inputs.macos || vars.MACOS_RELEASE_ENABLED == 'true' }}
        with:
          script: |
            const fs = require('node:fs');
            const root = JSON.parse(fs.readFileSync('package.json', 'utf8'));
            const desktop = JSON.parse(fs.readFileSync('packages/desktop/package.json', 'utf8'));
            if (root.version !== desktop.version) {
              throw new Error('Root and desktop package versions must match');
            }
            if (context.ref.startsWith('refs/tags/') && context.ref !== `refs/tags/${desktop.version}`) {
              throw new Error(`Release tag must be ${desktop.version}`);
            }
            const include = [
              { os: 'windows-2022', target: 'windows-x64', artifact: `OMP-Desktop-Setup-${desktop.version}-x64` }
            ];
            if (process.env.BUILD_MACOS === 'true') {
              include.push({ os: 'macos-14', target: 'darwin-arm64', artifact: `OMP-Desktop-${desktop.version}-arm64` });
            }
            core.setOutput('matrix', JSON.stringify({ include }));

  build:
    needs: prepare
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          submodules: recursive
      - uses: actions/setup-node@v4
        with:
          node-version-file: .tool-versions
          cache: npm
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-10-06
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: omp-sdk -> target/desktop
      - name: Install dependencies
        run: npm ci
      - name: Package Windows
        if: runner.os == 'Windows'
        run: npm run build:windows
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - name: Package unsigned macOS
        if: runner.os == 'macOS'
        run: >-
          npm run build:desktop -- --mac --arm64 --publish never
          --config.mac.identity=null
          --config.mac.notarize=false
          --config.forceCodeSigning=false
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - name: Collect release assets
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('node:fs');
            const path = require('node:path');
            const source = 'packages/desktop/release';
            const files = fs.readdirSync(source).filter(name =>
              /\.(exe|dmg|zip|blockmap)$/.test(name) ||
              (/\.yml$/.test(name) && !name.startsWith('builder-')));
            const required = process.platform === 'win32'
              ? [/\.exe$/, /\.zip$/, /\.blockmap$/, /\.yml$/]
              : [/\.dmg$/, /\.zip$/, /-mac\.yml$/];
            for (const pattern of required) {
              if (!files.some(name => pattern.test(name))) {
                throw new Error(`Missing release asset matching ${pattern}`);
              }
            }
            fs.mkdirSync('release-assets', { recursive: true });
            for (const name of files) fs.copyFileSync(path.join(source, name), path.join('release-assets', name));
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: release-assets/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: OMP-Desktop-*
          path: release-assets
          merge-multiple: true
      - name: Upload assets to draft release
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('node:fs');
            const path = require('node:path');
            const repo = context.repo;
            const tag = context.ref.slice('refs/tags/'.length);
            const releases = await github.paginate(github.rest.repos.listReleases, { ...repo, per_page: 100 });
            let release = releases.find(item => item.tag_name === tag);
            if (release && !release.draft) {
              throw new Error(`Release ${tag} is already published; refusing to replace public assets`);
            }
            if (!release) {
              ({ data: release } = await github.rest.repos.createRelease({
                ...repo, tag_name: tag, name: tag, draft: true,
                prerelease: tag.includes('-')
              }));
            }
            const existing = await github.paginate(github.rest.repos.listReleaseAssets, {
              ...repo, release_id: release.id, per_page: 100
            });
            for (const name of fs.readdirSync('release-assets')) {
              const previous = existing.find(asset => asset.name === name);
              if (previous) await github.rest.repos.deleteReleaseAsset({ ...repo, asset_id: previous.id });
              await github.rest.repos.uploadReleaseAsset({
                ...repo, release_id: release.id, name,
                data: fs.readFileSync(path.join('release-assets', name))
              });
            }
            await core.summary.addLink('Review draft release', release.html_url).write();
